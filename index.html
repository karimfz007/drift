<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="The First Night — you wash ashore at dusk. Cold is coming." />
    <title>The First Night</title>
    <style>
        :root {
            --text: #f0ece4;
            --dim: #a9b6c6;
            --warm: #f0a860;
            --danger: #d9694a;
            --panel: rgba(9, 14, 22, 0.93);
            --edge: rgba(120, 140, 165, 0.35);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #05080f;
            overflow: hidden;
            /* A3: no pinch/zoom traps, no double-tap zoom, no pull-to-refresh. */
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        #game-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }

        /* The UI layer is transparent to touch except where a control actually is. */
        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        #ui button { pointer-events: auto; }

        /* ---- HUD ---- */

        .hud { position: absolute; inset: 0; }

        /* Four compact vital bars, stacked top-left. */
        .vitals {
            position: absolute;
            top: calc(10px + var(--safe-top));
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
        }

        .vital { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 7px; }
        /*  11px is this project's legibility floor, enforced by the Gate 0 sweep — the
            vital labels sat at 10px and were the only text below it. */
        .vital-name { font-size: 11px; letter-spacing: 0.12em; color: var(--dim); }

        .vital-bar {
            width: min(40vw, 190px);
            height: 11px;
            border: 1px solid var(--edge);
            border-radius: 3px;
            background: rgba(6, 10, 16, 0.6);
            overflow: hidden;
        }

        .vital-fill { height: 100%; width: 100%; transition: width 220ms linear, background 400ms linear; }
        .vital-label { font-size: 12px; color: var(--dim); min-width: 20px; }

        .hud-corner {
            position: absolute;
            top: calc(12px + var(--safe-top));
            right: 68px;
            text-align: right;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
        }
        .clock { font-size: 15px; font-weight: 700; color: var(--text); }

        /* The carried-inventory chip strip, below the vitals (5 rows since C05's energy). */
        .inv {
            position: absolute;
            top: calc(104px + var(--safe-top));
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .chip {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            background: rgba(9, 14, 22, 0.66);
            border: 1px solid var(--edge);
            border-radius: 5px;
            padding: 2px 7px;
        }
        .chip.tool { color: #0c1420; background: var(--warm); border-color: #ffe6a3; }
        /* Food chips are tappable — the direct-world "tap the thing to use it" for eating. */
        .chip.food { pointer-events: auto; cursor: pointer; border-color: rgba(143, 191, 122, 0.55); }
        .chip.food:active { transform: scale(0.94); }
        .chip.food::after { content: " ·eat"; color: var(--dim); font-weight: 500; }
        /* A full flask is a carried drink — tap it to sip inland. */
        .chip.tool.drink { pointer-events: auto; cursor: pointer; }
        .chip.tool.drink:active { transform: scale(0.94); }
        .chip.tool.drink::after { content: " ·drink"; color: #0c1420; opacity: 0.6; font-weight: 500; }

        .hud-bottom {
            position: absolute;
            left: 0;
            right: 14px;
            bottom: calc(18px + var(--safe-bottom));
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .goal {
            font-size: 13px;
            color: var(--dim);
            background: rgba(6, 10, 16, 0.55);
            padding: 5px 10px;
            border-radius: 5px;
            max-width: 62vw;
            text-align: right;
        }

        .action {
            min-width: 168px;
            min-height: 56px;
            padding: 0 22px;
            font: inherit;
            font-size: 18px;
            font-weight: 700;
            color: var(--dim);
            background: rgba(12, 20, 32, 0.85);
            border: 2px solid var(--edge);
            border-radius: 10px;
        }

        .action.ready { color: #0c1420; background: var(--warm); border-color: #ffe6a3; }
        .action:active { transform: scale(0.96); }

        .action-row { display: flex; align-items: flex-end; gap: 10px; }
        .secondary-action {
            min-width: 96px;
            min-height: 52px;
            padding: 0 16px;
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            background: rgba(12, 20, 32, 0.85);
            border: 2px solid var(--edge);
            border-radius: 10px;
        }
        .secondary-action:active { transform: scale(0.96); }

        /* D-063: the loadout panel's entry point. Sits directly under the Look button so
           the two persistent panel openers share one corner and one visual language. */
        /*  The pack itself, drawn — the affordance for "what am I carrying" is the object,
            not the word (URGENT FIX, 2026-07-27). Sized past the 44px touch minimum with the
            load reading under it, so it is both findable and honest at a glance.  */
        .carried-button {
            position: absolute;
            top: calc(66px + var(--safe-top));
            right: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            min-width: 56px;
            min-height: 56px;
            padding: 5px 6px 4px;
            font: inherit;
            color: var(--dim);
            background: rgba(12, 20, 32, 0.7);
            border: 1px solid var(--edge);
            border-radius: 10px;
            opacity: 0.9;
        }
        .carried-button .pack-icon { width: 28px; height: 28px; display: block; }
        .carried-button .pack-body { fill: rgba(150, 116, 74, 0.85); stroke: var(--edge); stroke-width: 1; }
        .carried-button .pack-flap { fill: rgba(94, 71, 44, 0.95); }
        .carried-button .pack-strap { stroke: rgba(150, 116, 74, 0.95); }
        .carried-button .pack-load { font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }
        /*  Overloaded is the one state the pack must not report quietly (D-059). */
        .carried-button .pack-load.heavy { color: var(--danger); }
        /*  Try-Combining's surface. Chips are pick-to-select; the button stays disabled
            until exactly two are chosen, so the verb cannot fire half-formed.  */
        /*  THE RADIAL CIRCLE (Slice 2). The hub is absolutely positioned so the inline
            left/top the renderer computes actually applies — without this the segments lay
            out in normal flow and translate from wherever that landed, which is exactly how
            three of them ended up off-screen with the clamp doing nothing. The panel itself
            goes full-bleed and transparent: it is a tap-catcher, not a card.  */
        .panel.verb-circle { position: fixed; inset: 0; background: transparent; border: none;
            box-shadow: none; padding: 0; max-width: none; width: 100%; height: 100%; }
        .panel.verb-circle .verb-hub { position: absolute; width: 0; height: 0; }
        .panel.verb-circle .verb-seg { position: absolute; left: 0; top: 0; margin: -26px 0 0 -58px;
            width: 116px; min-height: 52px; display: flex; flex-direction: column; gap: 2px;
            align-items: center; justify-content: center; padding: 6px 8px;
            border-radius: 14px; border: 1px solid var(--line);
            background: rgba(18, 20, 24, 0.92); color: var(--fg); font: inherit; }
        /*  CROWDED ARC. The circle's geometry is FIXED — the arc, the radius and the sweep
            are certified by SLICE 2's ONE-THUMB REACH gate, so nothing here moves them.
            What changed is the count: DROP 3 made brewing a remedy the FIFTH verb on the
            fire, and at five the arc puts adjacent centres ~75px apart while a segment is
            116px wide. They overlapped, elementFromPoint returned the neighbour, and every
            fire verb — feed, light torch, make journal, write, brew — became unpickable.
            The device caught it as four separate failures with one cause.
            Narrowing the segment fixes the overlap without touching the arc, so the reach
            gate is unaffected by construction rather than by re-measurement. 68px still
            clears the ~48px minimum a thumb needs.  */
        .panel.verb-circle.crowded .verb-seg { width: 68px; margin-left: -34px; padding: 5px 4px; }
        .panel.verb-circle.crowded .verb-label { font-size: 12px; line-height: 1.15; }
        .panel.verb-circle.crowded .verb-reason { display: none; }
        .panel.verb-circle .verb-seg.ready { border-color: var(--good); }
        .panel.verb-circle .verb-seg.blocked { opacity: 0.55; }
        .panel.verb-circle .verb-label { font-weight: 600; }
        .panel.verb-circle .verb-reason { font-size: 11px; opacity: 0.8; text-align: center; line-height: 1.2; }
        .panel .combine-row { display: flex; flex-direction: column; gap: 6px; align-items: center; }
        .panel .combine-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .panel .combine-chip.picked { outline: 2px solid var(--good); color: var(--fg); }
        .panel .try-combine-btn[disabled] { opacity: 0.45; }
        .panel .storage-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        /* D-063: the loadout panel's zone rows. */
        .panel.loadout .zone-row { display: flex; gap: 10px; align-items: baseline; margin: 6px 0; }
        .panel.loadout .zone-name { min-width: 104px; font-size: 12px; font-weight: 700; color: var(--dim); }
        .panel.loadout .zone-items { display: flex; flex-wrap: wrap; gap: 5px; }
        .panel.loadout .equip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
        .panel.loadout .equip-btn.held { border-color: var(--accent); color: var(--text); }
        .chip.warn { border-color: #c9a227; color: #f0d98a; }

        .settings-button {
            position: absolute;
            top: calc(14px + var(--safe-top));
            right: 14px;
            min-width: 62px;
            min-height: 44px;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            color: var(--dim);
            background: rgba(12, 20, 32, 0.7);
            border: 1px solid var(--edge);
            border-radius: 8px;
            opacity: 0.75;
        }

        /* The controlled new-build prompt (D-014) — small, top-center, never blocks play.
           Kept away from the bottom, where every panel's action button tends to sit, so it
           can never repeat the swallowed-tap bug class the FIX 1 CSS overflow fix addressed. */
        #update-banner {
            position: fixed;
            left: 50%;
            top: calc(14px + var(--safe-top));
            transform: translateX(-50%) translateY(-12px);
            z-index: 55;
            opacity: 0;
            transition: opacity 260ms ease, transform 260ms ease;
            pointer-events: none;
        }
        #update-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #update-banner button {
            pointer-events: auto;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            color: #0c1420;
            background: var(--warm);
            border: 2px solid #ffe6a3;
            border-radius: 9px;
            padding: 8px 16px;
        }

        .hint {
            position: absolute;
            left: 50%;
            bottom: calc(160px + var(--safe-bottom));
            transform: translateX(-50%) translateY(8px);
            max-width: 78vw;
            padding: 9px 14px;
            border-radius: 7px;
            background: rgba(9, 14, 22, 0.86);
            color: var(--warm);
            font-size: 15px;
            text-align: center;
            opacity: 0;
            transition: opacity 260ms ease, transform 260ms ease;
        }

        .hint.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ---- Virtual stick ---- */

        .stick-base, .stick-knob {
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 50%;
            margin-left: -39px;
            margin-top: -39px;
            width: 78px;
            height: 78px;
            transition: opacity 160ms ease;
            pointer-events: none;
        }

        .stick-base { border: 2px solid rgba(180, 200, 220, 0.5); background: rgba(10, 16, 26, 0.28); }

        .stick-knob {
            width: 46px;
            height: 46px;
            margin-left: -23px;
            margin-top: -23px;
            background: rgba(240, 236, 228, 0.7);
        }

        /* ---- Panels ---- */

        .panel {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* flex-start, not center: on a short landscape viewport (D-041 pivoted the game
               to ~412px tall) a tall panel (the morning report, in particular) can be taller
               than the screen. Centered content overflows equally off BOTH edges, which sat
               the dismiss button below the visible viewport with no way to reach it (FIX 1,
               2026-07-23 handoff) -- elementFromPoint at its real screen position returned
               null, confirming nothing was covering it: it was simply never on-screen.
               flex-start plus overflow-y:auto guarantees the button is always reachable,
               scrolled to if need be, on any viewport height. */
            justify-content: flex-start;
            gap: 14px;
            padding: 28px;
            box-sizing: border-box;
            background: var(--panel);
            text-align: center;
            opacity: 0;
            transition: opacity 300ms ease;
            pointer-events: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Tighten spacing on short landscape viewports so the common case needs no scroll
           at all; overflow-y:auto above is the guaranteed fallback for anything longer. */
        @media (max-height: 480px) {
            .panel { gap: 8px; padding: 14px 28px; }
            .panel h1 { font-size: clamp(22px, 7vw, 34px); }
            .panel h2 { font-size: 20px; }
            .panel p { font-size: 15px; line-height: 1.35; }
            .panel .lines { gap: 8px; margin: 3px 0 2px; }
            .panel .primary { margin-top: 4px; min-height: 46px; }
            .build-list { gap: 8px; }
            .build-item { padding: 8px 12px; }
            .build-item h2 { font-size: 16px; }
            .build-item .primary { min-height: 40px; }
        }

        .panel.visible { opacity: 1; }
        .panel.leaving { opacity: 0; }

        /* ARMING: a panel ignores hit-tested input while it is still fading in.

           Every panel is `inset: 0` and is created DURING the tap that opens it, so the
           browser's trailing compatibility click for that same touch lands on the panel that
           just appeared underneath the finger. A device probe measured it: tapping the pack
           on the survivor's back opened the Backpack and the stray click pressed
           `.growth-btn`, switching it to Skills before the thumb had left the glass.

           THE BUTTON RULE IS THE WHOLE POINT. `#ui button { pointer-events: auto }` above is
           MORE specific than a plain `.panel { pointer-events: none }`, so guarding only the
           container does nothing at all — the first attempt at this fix set the container
           inline and the panel went on pressing itself, with `pe=none` sitting in the probe's
           own readout. These selectors carry the `#ui` id precisely so they outrank it.

           Hit-testing only: `element.click()` dispatches directly and is unaffected, which is
           the right line to draw — a stray click is a hit on a surface nobody aimed at, while
           a programmatic press is somebody naming the button. */
        #ui .panel.arming,
        #ui .panel.arming button { pointer-events: none; }

        .panel h1 { font-size: clamp(30px, 9vw, 46px); letter-spacing: 0.14em; margin: 0; }
        .panel h2 { font-size: 25px; margin: 0; }
        .panel p { margin: 0; line-height: 1.55; font-size: 17px; }
        .panel .subtitle { color: var(--warm); font-size: 14px; }
        .panel .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: min(320px, 80vw);
            min-height: 48px;
            padding: 0 4px;
            font-size: 16px;
        }
        .panel .toggle-row input[type="checkbox"] { width: 22px; height: 22px; }

        .panel .lines {
            text-align: left;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 6px 0 4px;
        }

        .panel .primary {
            margin-top: 10px;
            min-height: 56px;
            padding: 0 30px;
            font: inherit;
            font-size: 18px;
            font-weight: 700;
            color: #0c1420;
            background: var(--warm);
            border: 2px solid #ffe6a3;
            border-radius: 10px;
        }

        .panel .choices { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        .panel .choices button {
            min-width: 104px;
            min-height: 56px;
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            background: rgba(12, 20, 32, 0.85);
            border: 2px solid var(--edge);
            border-radius: 10px;
        }

        .panel .choices button.on { color: #0c1420; background: var(--warm); border-color: #ffe6a3; }
        .panel .quiet {
            margin-top: 6px;
            min-height: 48px;
            padding: 0 22px;
            font: inherit;
            font-size: 15px;
            color: var(--dim);
            background: transparent;
            border: 1px solid var(--edge);
            border-radius: 9px;
        }
        .panel .primary[disabled] { opacity: 0.5; }
        .cold-open p, .death .subtitle { color: var(--dim); }

        /* Craft card gates. */
        .gates { display: flex; flex-direction: column; gap: 8px; width: min(320px, 80vw); }
        .gate {
            display: flex;
            justify-content: space-between;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 16px;
            border: 1px solid var(--edge);
        }
        .gate.met { color: var(--good); border-color: rgba(143, 191, 122, 0.5); }
        .gate.unmet { color: var(--danger); }
        .gate-hint { font-size: 12px; color: var(--dim); text-align: left; margin: -3px 4px 3px; }
        .death-count { color: var(--dim); font-size: 14px; }

        /* Item 4 — the skill progress bar. Same visual language as a vital bar so a player
           reads it without being taught: a filled track means "this much of the way". */
        .skill-row { padding: 8px 0; border-bottom: 1px solid var(--edge); }
        .skill-bar { height: 6px; background: rgba(255,255,255,0.10); border-radius: 3px; margin: 6px 0 4px; overflow: hidden; }
        .skill-fill { height: 100%; background: var(--good); border-radius: 3px; transition: width 220ms ease; }
        .drop-chips, .hand-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

        /* THE DEATH REVIEW (Slice 3). The panel is now long enough to need scrolling on a
           phone, and the same REACHABILITY rule the Backpack learned the hard way applies:
           the button at the bottom must stay on screen, or the player can read their own
           death and not be able to leave it. So the sections scroll INSIDE a bounded box
           while the button sits outside it. */
        .panel.death { max-height: 88vh; }
        .panel.death .death-section {
            text-align: left; width: min(380px, 88vw); margin: 0 auto 10px;
            border-top: 1px solid var(--edge); padding-top: 8px;
        }
        .panel.death .death-section h3 {
            font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--dim); margin: 0 0 6px;
        }
        .panel.death ul { margin: 0; padding-left: 18px; }
        .panel.death li { font-size: 14px; line-height: 1.45; margin-bottom: 5px; }
        .death-couldhave li { color: var(--warn, #d8b26a); }
        .death-legacy li { color: var(--good); }
        .arrival-line {
            font-size: 16px; line-height: 1.5; max-width: min(380px, 88vw);
            margin: 0 auto 10px; text-align: left;
        }

        /* The Build panel (C05): axe / shelter / storage, each its own gated card — never a
           shared priority slot (D-040/D-042's lesson, applied up front this time). */
        .build-list { display: flex; flex-direction: column; gap: 12px; width: min(360px, 85vw); text-align: left; }
        .build-item {
            border: 1px solid var(--edge);
            border-radius: 10px;
            padding: 12px 16px;
        }
        /*  THE HINT (Slice 2B Stage 2b). A thought, not an offer — so it reads differently
            from the rows around it: no border box, dimmer, italic. It must never look like
            something you can press, because the whole point is that you cannot yet.  */
        .build-item.hint-item { border-style: dashed; opacity: 0.9; }
        .build-item.hint-item .hint-line { font-style: italic; font-size: 13px; margin: 0 0 4px; }
        .build-item.hint-item .hint-how { font-size: 11px; opacity: 0.7; margin: 6px 0 0; }
        /*  THE SITE CARD (§9.6). Opens where the survivor chose. A blocked outcome is SHOWN
            greyed with its reason — the radial circle's rule, for the same reason: hiding a
            thing you nearly have teaches nothing.  */
        .site-item { border: 1px solid var(--edge); border-radius: 10px; padding: 10px 14px; }
        .site-item.ready { border-color: var(--good); }
        .site-item.blocked { opacity: 0.62; }
        .site-item .site-reason { font-size: 12px; margin: 6px 0 0; }
        .site-item .site-btn { width: 100%; margin-top: 8px; min-height: 44px; }
        .site-lead { font-style: italic; }

        /*  THE BACKPACK HUB'S TABS (Law 126). Three, by law — Inventory, Vitals, Skills.
            Big enough for a thumb and legible at phone size, because a tab bar that needs
            aiming is a tab bar that gets mis-tapped mid-emergency.  */
        /*  STICKY, both ends. The panel has scrolled since FIX 1 (2026-07-23), which fixed
            exactly this for the morning report: a panel taller than a 412px landscape
            viewport put its dismiss button below the fold with no way to reach it. Adding a
            tab bar re-created that on the tallest tab — eight capacities plus three crossings
            plus the bar pushed Close off-screen, the harness's close silently missed, the
            panel lock stayed held, and a storage tap six hundred lines later did nothing.
            Relying on "the content happens to fit" is what failed twice; pinning both
            controls is a guarantee that does not depend on how much a tab has to say.  */
        .backpack-tabs {
            display: flex; gap: 6px; margin: 0 0 10px;
            position: sticky; top: 0; z-index: 2;
            background: var(--panel-bg, rgba(18, 16, 14, 0.96));
            padding: 4px 0;
        }
        .panel.backpack .close-btn {
            position: sticky; bottom: 0; z-index: 2;
            width: 100%;
        }
        .backpack-tab {
            flex: 1; min-height: 44px; padding: 8px 4px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--edge); border-radius: 9px;
            color: var(--ink); font-size: 14px; font-weight: 600;
        }
        .backpack-tab.active { background: rgba(255, 214, 140, 0.16); border-color: var(--warm); }
        .backpack-tab:active { transform: scale(0.97); }

        /*  THE VITALS TAB. The bars already say how bad it is; these lines say WHY, which is
            the part a player can act on.  */
        .vital-line { border: 1px solid var(--edge); border-radius: 10px; padding: 10px 14px; }
        .vital-line .build-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
        .vital-line .vital-cause { font-size: 12px; opacity: 0.78; margin: 6px 0 0; }
        .vital-line.pressing { border-color: var(--warm); }
        .vitals-summary { font-style: italic; }

        /*  THE GROWTH CARD (FIX 1). Deliberately quiet: this is a thing you read, not a
            thing you spend. No bars, no numbers, no allocate button — a body is not a
            character sheet, which is the whole reason §12 has capacities instead of stats.  */
        .growth-item { border: 1px solid var(--edge); border-radius: 10px; padding: 10px 14px; }
        .growth-item .build-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
        .growth-item .growth-how { font-size: 11px; opacity: 0.7; margin: 6px 0 0; font-style: italic; }
        .standing-chip { font-size: 11px; opacity: 0.75; white-space: nowrap; }
        .standing-chip.good { color: var(--good); opacity: 1; }
        .growth-item.standing-as-you-landed { opacity: 0.72; }
        .growth-item.standing-practised { border-color: var(--good); }
        .growth-item.cross-item { border-style: dashed; }
        .growth-item.cross-item.crossed { border-style: solid; border-color: var(--good); }
        .growth-divider { font-size: 12px; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.08em; margin: 6px 0 -2px; }
        .growth-summary { font-style: italic; }
        .growth-btn { width: 100%; margin: 4px 0 2px; }
        .build-item h2 { font-size: 18px; margin: 0 0 2px; }
        .build-item .subtitle { font-size: 12px; margin: 0 0 8px; }
        .build-item .gates { width: 100%; gap: 6px; }
        .build-item .gate { padding: 6px 10px; font-size: 14px; }
        .build-item .primary { width: 100%; margin-top: 8px; min-height: 46px; }
        .build-item.done { opacity: 0.55; }
        .build-item.done .subtitle { color: var(--good); }

        /* Level-up toast. */
        .level-toast {
            position: absolute;
            left: 50%;
            top: 30%;
            transform: translate(-50%, -8px);
            text-align: center;
            padding: 12px 20px;
            border-radius: 10px;
            background: rgba(9, 14, 22, 0.9);
            border: 1px solid var(--warm);
            color: var(--text);
            font-size: 17px;
            opacity: 0;
            transition: opacity 380ms ease, transform 380ms ease;
            pointer-events: none;
        }
        .level-toast.visible { opacity: 1; transform: translate(-50%, 0); }
        .level-toast strong { color: var(--warm); }
        .level-toast span { color: var(--dim); font-size: 13px; }

        /* First-pickup identity toast — names a new resource once (D-043). */
        .pickup-toast {
            position: absolute;
            left: 50%;
            top: 22%;
            transform: translate(-50%, -8px);
            text-align: center;
            padding: 10px 18px;
            border-radius: 10px;
            background: rgba(9, 14, 22, 0.9);
            border: 1px solid rgba(143, 191, 122, 0.55);
            color: var(--text);
            font-size: 16px;
            opacity: 0;
            transition: opacity 360ms ease, transform 360ms ease;
            pointer-events: none;
        }
        .pickup-toast.visible { opacity: 1; transform: translate(-50%, 0); }
        .pickup-toast strong { color: var(--warm); }
        .pickup-toast span { color: var(--dim); font-size: 12px; }

        /* ---- Rotate-to-landscape prompt (D-041) ---- */
        #rotate-prompt {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            padding: 24px;
            background: #05080f;
            color: var(--text);
            z-index: 60;
        }
        #rotate-prompt.show { display: flex; }
        #rotate-prompt .rotate-icon {
            font-size: 54px;
            color: var(--warm);
            animation: rotate-hint 2.4s ease-in-out infinite;
        }
        #rotate-prompt p { margin: 0; font-size: 20px; font-weight: 700; }
        #rotate-prompt span { color: var(--dim); font-size: 14px; }
        @keyframes rotate-hint {
            0%, 40% { transform: rotate(0deg); }
            60%, 100% { transform: rotate(90deg); }
        }

        /* ---- Transient feedback ---- */

        .float-text {
            position: absolute;
            left: 50%;
            top: 46%;
            transform: translate(-50%, 0);
            font-size: 19px;
            font-weight: 700;
            color: var(--warm);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
            /*  Duration is set inline from TUNE.floatTextMs — one clock for the
                message, so the text cannot outlive its fade or vice versa.  */
            animation: rise 900ms ease-out forwards;
            pointer-events: none;
        }

        /*  HOLDS at full opacity for most of its life, then leaves. The old curve faded
            continuously from 18% onward, so a message was legible for a fraction of its
            already-short duration — the director could not read either the combination
            outcome or the stone-node yield.  */
        @keyframes rise {
            0% { opacity: 0; transform: translate(-50%, 10px); }
            8% { opacity: 1; transform: translate(-50%, 0); }
            78% { opacity: 1; transform: translate(-50%, -22px); }
            100% { opacity: 0; transform: translate(-50%, -46px); }
        }

        .ignition-flash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 58%, rgba(255, 214, 140, 0.55), rgba(255, 150, 60, 0) 62%);
            animation: flash 420ms ease-out forwards;
            pointer-events: none;
        }

        @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

        #boot-splash {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05080f;
            color: #6f7f96;
            letter-spacing: 0.35em;
            font-size: 12px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 500ms ease;
            z-index: 50;
        }

        @media (prefers-reduced-motion: reduce) {
            .wood.pulse, .float-text, .ignition-flash, #rotate-prompt .rotate-icon { animation: none; }
        }
    </style>
</head>

<body>
    <canvas id="game-canvas" touch-action="none"></canvas>
    <div id="ui"></div>
    <div id="boot-splash">The First Night</div>
    <script type="module" src="/src/body/main.ts"></script>
</body>

</html>
