name: deploy

# One stable play URL, auto-deployed on every push to main (Ops v1.2 §5 law 4).
# Per-cycle archives under /builds/<cycle-id>/ are published alongside the current build
# so any cycle can be replayed and compared.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gates that must hold before anything reaches the director's phone.
      - run: npm run purity
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      - name: Publish the per-cycle archives alongside the current build
        run: |
          if [ -d builds ]; then
            mkdir -p dist/builds
            cp -r builds/. dist/builds/
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # DEPLOY-WITNESS (C1 item 0c). The deploy step reporting success means the artifact was
      # handed to Pages — not that Pages is serving it. Between the two sit a publish and a
      # CDN, and a green workflow above a stale site is exactly the state that cost a session:
      # four defects reported against a build nobody could identify.
      #
      # So the run does not go green until the SERVED page returns the sha this run built.
      # It retries, because propagation is genuinely not instant and a single early read
      # would fail honest deploys — but it retries a bounded number of times and then FAILS,
      # rather than warning. A warning here would be a green tick over an unproven claim.
      - name: Witness the served build
        run: |
          EXPECTED="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "expecting ${EXPECTED} at ${URL}"
          for i in $(seq 1 10); do
            SERVED="$(curl -fsSL --max-time 20 "${URL}?witness=$(date +%s)" \
              | grep -o 'name="drift-build" content="[^"]*"' \
              | sed 's/.*content="//;s/"//' || true)"
            echo "attempt ${i}: served='${SERVED:-<none>}'"
            if [ "${SERVED}" = "${EXPECTED}" ]; then
              echo "WITNESSED: ${URL} is serving ${SERVED}"
              exit 0
            fi
            sleep 15
          done
          echo "FAILED SHIP: expected ${EXPECTED}, served '${SERVED:-<none>}' after 10 attempts"
          exit 1
